services:
  ghost:
    image: ghost:5.130.2
    container_name: my-ghost
    ports:
      - "2368:2368"
    environment:
      NODE_ENV: development
      url: http://localhost:2368
    volumes:
      - ./ghost-data:/var/lib/ghost/content
      - ./ghost-theme/source:/var/lib/ghost/current/content/themes/source
    restart: unless-stopped
